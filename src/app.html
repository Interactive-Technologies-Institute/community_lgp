<!doctype html>
<html lang="en" %ska.html.attributes%>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/branding/brandmark-dark.svg" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/branding/brandmark-light.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Dicionário LGP" />
		<script>
			// Chrome fires this once per page load, possibly before the app hydrates or while the
			// user is on a page without the install prompt. Keep it so InstallPrompt can use it later.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installPromptEvent = e;
				window.dispatchEvent(new Event('installpromptready'));
			});
		</script>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/InterVariable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/InterVariable-Italic.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" %ska.body.attributes%>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
